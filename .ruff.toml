# CI 门禁配置：只开「语法错误 / 未定义名 / 明显 bug」类关键规则。
#
# 为什么不一次性开全套规则？本项目已有 400+ 测试且在持续演进，
# 一次性开 E/F/W 全套会让门禁首次跑红、被迫挂 continue-on-error（等于门禁失效）。
# 这里采取「先守住致命错误、再逐步收紧」的渐进策略：
#   E9  语法错误（E902 IO 错误、E999 语法错误）
#   F63 比较链 / 断言形式错误
#   F7  类型注解与文档串中的语法问题
#   F82 未定义名（拼写错的变量/函数，最容易在改动中溜进生产）
# 后续可在本地跑通后逐条加规则（如 F401 未使用导入、E501 行宽）。
line-length = 120
target-version = "py311"

# 非源码目录/生成物不参与检查
extend-exclude = [
    "data",
    "web",
    "deploy",
    "hf_space_build",
    "kb",
    "tools/redis",
    "venv",
    ".venv",
    "__pycache__",
]

# 注意：ruff 0.16+ 把 lint 相关配置收进 [lint] 段（顶层写法已弃用）
[lint]
select = ["E9", "F63", "F7", "F82"]
