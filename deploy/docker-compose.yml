# TeleOps 自托管编排：backend(FastAPI) + caddy(自动 HTTPS 反向代理)
#
# 用法：
#   1. cp deploy/.env.example deploy/.env  并填入密钥
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#
# 说明：
#   - backend 单端口 8000 同时提供 API 与静态界面，Caddy 反代到 backend:8000
#   - 业务数据落在 named volume（首跑从镜像基线 seed），重启不丢
#   - 变量来自 deploy/.env（compose 自动加载做 ${} 替换；同时注入容器环境）

services:
  backend:
    build:
      # compose 文件位于 deploy/，上下文需指向项目根目录，才能正确解析 Dockerfile 中的 deploy/requirements.txt
      context: ..
      dockerfile: deploy/Dockerfile
    image: teleops-backend:latest
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TELEOPS_API_TOKEN: ${TELEOPS_API_TOKEN:-}
      TELEOPS_INVITE_CODE: ${TELEOPS_INVITE_CODE:-}
      TELEOPS_CORS_ORIGINS: ${TELEOPS_CORS_ORIGINS:-}
      TELEOPS_RATE_LIMIT: ${TELEOPS_RATE_LIMIT:-on}
      USE_CHROMA: ${USE_CHROMA:-0}
      # 容器内显式对外监听，保证 Caddy（同 compose 网络）能反代到 backend:8000
      TELEOPS_HOST: "0.0.0.0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - teleops_data:/app/data
      - teleops_kb:/app/kb
      - teleops_tools:/app/tools
      - teleops_traces:/app/traces

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddyfile 内用 {env.TELEOPS_DOMAIN} 引用；localhost 走内部 CA 自签（本地自测）
      TELEOPS_DOMAIN: ${TELEOPS_DOMAIN:-localhost}
      # Caddyfile 全局 email 选项引用，公网证书申请（Let's Encrypt）必须
      TELEOPS_ACME_EMAIL: ${TELEOPS_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---------- 可观测性（可选）：加 --profile observability 才启动 ----------
  # 用法：docker compose -f deploy/docker-compose.yml --profile observability up -d
  # 打开 http://localhost:3000（Grafana，已预置 Prometheus 数据源与「TeleOps 运行概览」面板）
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 演示环境允许匿名只读查看面板；生产请移除下面两行
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  teleops_data:
  teleops_kb:
  teleops_tools:
  teleops_traces:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
