<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#c7d0da; stroke-width:1.5; rx:8; }
      .box-b { fill:#eef4fb; stroke:#7aa7d8; stroke-width:1.5; }
      .box-g { fill:#eef9f0; stroke:#7bc08a; stroke-width:1.5; }
      .box-y { fill:#fdf6e3; stroke:#e0b84a; stroke-width:1.5; }
      .title { font-size:20px; font-weight:700; fill:#1f2a37; }
      .lbl { font-size:13px; font-weight:600; fill:#243042; }
      .sub { font-size:11px; fill:#67748a; }
      .flow { font-size:11px; fill:#39507a; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="600" fill="#f7f9fc"/>
  <text x="470" y="34" text-anchor="middle" class="title">TeleOps · 一加二闭环智能体平台架构</text>

  <!-- 告警源 -->
  <text x="30" y="74" class="lbl">告警源（预留接入）</text>
  <rect x="30" y="84" width="150" height="42" class="box"/>
  <text x="105" y="104" text-anchor="middle" class="sub">Zabbix</text>
  <text x="105" y="119" text-anchor="middle" class="sub">iMaster NCE</text>
  <rect x="30" y="134" width="150" height="42" class="box"/>
  <text x="105" y="154" text-anchor="middle" class="sub">Prometheus</text>
  <text x="105" y="169" text-anchor="middle" class="sub">ELK 日志</text>
  <rect x="30" y="184" width="150" height="38" class="box"/>
  <text x="105" y="208" text-anchor="middle" class="sub">蓝鲸 CMDB / ITSM</text>

  <!-- 接入层 -->
  <rect x="30" y="248" width="150" height="56" class="box-b"/>
  <text x="105" y="270" text-anchor="middle" class="lbl">接入层 Adapters</text>
  <text x="105" y="289" text-anchor="middle" class="sub">Alert/Log/CMDB/Ticket/Exec/Knowledge</text>

  <!-- 前端 8 视图 -->
  <rect x="30" y="330" width="150" height="56" class="box-y"/>
  <text x="105" y="352" text-anchor="middle" class="lbl">前端 web/ 8 视图</text>
  <text x="105" y="371" text-anchor="middle" class="sub">作战室 / 看板 / 工作台 / 工具库…</text>

  <!-- 运维 Agent -->
  <rect x="220" y="120" width="200" height="120" class="box-g"/>
  <text x="320" y="146" text-anchor="middle" class="lbl">运维 Agent</text>
  <text x="320" y="170" text-anchor="middle" class="sub">降噪 → 根因推理</text>
  <text x="320" y="189" text-anchor="middle" class="sub">调工具处置</text>
  <text x="320" y="208" text-anchor="middle" class="sub">反馈新痛点给研发</text>
  <text x="320" y="228" text-anchor="middle" class="flow">LLM: DeepSeek / 离线 Mock</text>

  <!-- 研发 Agent -->
  <rect x="220" y="356" width="200" height="120" class="box-b"/>
  <text x="320" y="382" text-anchor="middle" class="lbl">研发 Agent</text>
  <text x="320" y="406" text-anchor="middle" class="sub">CodeGen 造工具</text>
  <text x="320" y="425" text-anchor="middle" class="sub">注册工具库 / 出变更单</text>
  <text x="320" y="444" text-anchor="middle" class="sub">写 SOP 沉淀知识库</text>

  <!-- 工具库 -->
  <rect x="470" y="92" width="160" height="74" class="box"/>
  <text x="550" y="116" text-anchor="middle" class="lbl">工具库 Registry</text>
  <text x="550" y="135" text-anchor="middle" class="sub">动态加载 tools/</text>
  <text x="550" y="152" text-anchor="middle" class="sub">风险分级 · 活视图</text>

  <!-- 知识库 -->
  <rect x="470" y="190" width="160" height="74" class="box"/>
  <text x="550" y="214" text-anchor="middle" class="lbl">知识库 KB</text>
  <text x="550" y="233" text-anchor="middle" class="sub">Chroma 优先</text>
  <text x="550" y="250" text-anchor="middle" class="sub">JSON 检索兜底</text>

  <!-- 需求看板 -->
  <rect x="470" y="356" width="160" height="74" class="box-y"/>
  <text x="550" y="380" text-anchor="middle" class="lbl">需求看板 Board</text>
  <text x="550" y="399" text-anchor="middle" class="sub">工具缺口需求</text>
  <text x="550" y="416" text-anchor="middle" class="sub">状态机 · 落盘</text>

  <!-- FastAPI 后端 -->
  <rect x="680" y="150" width="220" height="120" class="box"/>
  <text x="790" y="176" text-anchor="middle" class="lbl">FastAPI 后端</text>
  <text x="790" y="198" text-anchor="middle" class="sub">/agents /workspaces /requirements</text>
  <text x="790" y="215" text-anchor="middle" class="sub">/dispatch /adapters /metrics /health</text>
  <text x="790" y="235" text-anchor="middle" class="sub">JWT · 限流 · SQLite 持久化</text>
  <text x="790" y="254" text-anchor="middle" class="sub">Prometheus 指标</text>

  <!-- 底部：多租户 / CI / DeepSeek -->
  <rect x="220" y="510" width="200" height="64" class="box"/>
  <text x="320" y="534" text-anchor="middle" class="lbl">多租户隔离</text>
  <text x="320" y="553" text-anchor="middle" class="sub">workspace_id 逻辑隔离</text>
  <text x="320" y="568" text-anchor="middle" class="sub">删域级联清理</text>

  <rect x="470" y="510" width="160" height="64" class="box-b"/>
  <text x="550" y="534" text-anchor="middle" class="lbl">CI / CD</text>
  <text x="550" y="553" text-anchor="middle" class="sub">GitHub Actions</text>
  <text x="550" y="568" text-anchor="middle" class="sub">pytest 3.11/3.13 + Docker</text>

  <rect x="680" y="510" width="220" height="64" class="box-g"/>
  <text x="790" y="534" text-anchor="middle" class="lbl">DeepSeek 真实 LLM</text>
  <text x="790" y="553" text-anchor="middle" class="sub">根因推理 / 代码生成</text>
  <text x="790" y="568" text-anchor="middle" class="sub">无 Key 自动 Mock 兜底</text>

  <!-- 连线 -->
  <line x1="180" y1="105" x2="218" y2="160" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="155" x2="218" y2="170" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="185" x2="218" y2="180" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="276" x2="218" y2="175" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="358" x2="218" y2="400" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="160" x2="468" y2="125" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="200" x2="468" y2="220" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="400" x2="468" y2="380" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="129" x2="678" y2="190" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="227" x2="678" y2="210" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="393" x2="678" y2="225" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 闭环：运维 -> 研发（下），研发 -> 运维（上）-->
  <path d="M420,180 C450,250 450,250 420,360" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="270" class="flow" fill="#c0392b">识别缺工具 → 派研发</text>
  <path d="M220,400 C190,330 190,330 220,225" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="315" text-anchor="middle" class="flow" fill="#27ae60">造好工具 → 派回运维</text>
</svg>
