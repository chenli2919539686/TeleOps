name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/requirements.txt
          python -m pip install pytest httpx

      - name: Run tests
        env:
          # 测试自带隔离（临时 SQLite + 离线 Mock），CI 无需任何密钥
          DEEPSEEK_API_KEY: ""
        run: python -m pytest -q

  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile all Python sources
        run: python -m compileall -q src scripts tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JS syntax
        run: node --check web/app.js

      - name: Validate docker-compose config
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'PY'
          import yaml, pathlib
          p = pathlib.Path("deploy/docker-compose.yml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))
          assert "services" in data, "docker-compose 缺少 services"
          print("services:", list(data["services"]))
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f deploy/Dockerfile -t teleops-backend:ci .
