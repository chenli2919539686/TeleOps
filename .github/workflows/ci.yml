name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的多次推送只保留最新一次运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 准备 Node（前端语法门）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      # ---- 守卫 1：敏感文件不得入库（.env 存真实 Key，绝不能进 git）----
      # 排除 *.example / *.sample / *.template 这些合法示例文件
      - name: 守卫：敏感文件不得入库
        run: |
          hits=$(git ls-files \
            | grep -E '(^|/)\.env(\.[A-Za-z0-9_-]+)?$' \
            | grep -vE '(\.example|\.sample|\.template)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到 .env 类敏感文件被 git 跟踪：$hits"
            exit 1
          fi
          echo "OK：无敏感文件入库"

      # ---- 守卫 2：只开「语法错误 / 未定义名 / 明显 bug」关键规则（见 .ruff.toml）----
      - name: Lint（ruff 关键规则集）
        run: ruff check .

      # ---- 守卫 3：Python 语法编译门 ----
      - name: 编译门（Python 语法）
        run: python -m compileall -q src scripts tests

      # ---- 守卫 4：前端语法门（零构建项目，app.js 是唯一大文件）----
      - name: 前端语法门
        run: node --check web/app.js

      # ---- 守卫 5：全量测试门（核心）----
      # 失败时把 FAILED/ERROR 行以 ::error:: 抛出 → 变成 GitHub 注解，
      # 无需下载日志也能在 PR 页面直接看到失败用例名（排障友好）。
      # 说明：依赖真实 Redis 二进制 / Postgres DSN 的少数集成用例在无对应环境时
      # 会自动 skip（见 docs/13 §6.1），不阻断门禁。
      - name: 测试门（全量 pytest）
        run: |
          # 注意：GitHub 的 run 默认走 `bash -e`，若用 pipefail 会在失败管道处直接退出、
          # 后面的注解代码根本不执行。这里用 `|| true` 兜住 -e，再用 PIPESTATUS[0]
          # 取回 pytest 自己的退出码。
          python -m pytest tests/ -q --tb=line 2>&1 | tee pytest.log || true
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' pytest.log | head -10 | while read -r line; do
              echo "::error title=测试失败::$line"
            done
          fi
          exit $code
